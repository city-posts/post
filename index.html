<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City: What’s Happening</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e1d8;--acc:#e8512f;--acc2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--ink:#f1f0ec;--mut:#9a9aa2;--line:#2e2e34;--acc:#ff6a45;--acc2:#1a1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 170px}
header{padding:22px 0 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px}
button.pri{background:var(--acc);color:var(--acc2);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
#sign{flex:none;font-size:14px;padding:7px 12px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc2);display:grid;place-items:center;font-weight:700;font-size:14px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
img.ph{width:100%;max-height:480px;object-fit:cover;border-radius:10px;margin-top:10px;display:block}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{padding:5px 12px;font-size:14px}
.acts .liked{color:var(--acc);border-color:var(--acc)}
.note{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px}
.err{color:var(--acc);font-size:13px;margin-top:6px}
#prev{position:relative;margin-top:8px;display:none}
#prev img{max-width:100%;max-height:200px;border-radius:10px;display:block}
#prev button{position:absolute;top:6px;left:6px;padding:2px 9px}
.fab,.near{position:fixed;right:18px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.fab{bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--acc2);border:none;font-size:32px;line-height:1;padding:0}
.near{height:44px;border-radius:22px;padding:0 16px;font-weight:600;bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.near.cityb{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.near.on{background:var(--ink);color:var(--bg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pf{display:flex;gap:12px;align-items:center;margin-bottom:10px}.pf .av{width:52px;height:52px;font-size:22px}
.cm{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.cm p{margin:4px 0;font-size:14px;overflow-wrap:anywhere}.cm b{cursor:pointer}
.imgs{display:grid;gap:4px;margin-top:10px}.imgs.n2,.imgs.n3,.imgs.n4{grid-template-columns:1fr 1fr}.imgs img{margin:0;height:200px;max-height:none}.imgs.n1 img{height:auto;max-height:480px}
.link{cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>What’s <span>happening</span> in <span id="cityName">all cities</span></h1>
      <div class="sub">Share news, events and photos with your neighbours.</div>
    </div>
    <div style="display:flex;gap:6px;flex:none"><button id="me" type="button" style="font-size:14px;padding:7px 12px">👤 Profile</button><button id="sign" type="button">Sign in</button></div>
  </header>
  <div class="card">
    <div class="row" style="margin-top:0">
      <input id="city" list="cities" placeholder="Choose city or taluka (empty = all)" autocomplete="off" maxlength="60">
      <button id="gps" type="button">📍 Use my location</button>
      <button id="fol" type="button">👥 Following</button>
    </div>
    <datalist id="cities"></datalist>
    <div class="sub" id="cityMsg" style="margin-top:6px"></div>
  </div>
  <div id="feed"><div class="note">Loading the feed…</div></div>
</div>

<button class="near cityb" id="cityb" type="button">🏙️ City feed</button>
<button class="near" id="near" type="button">📍 Nearby</button>
<button class="fab" id="fab" type="button" aria-label="New post">+</button>

<div class="ov" id="ov">
  <div class="sheet">
    <div class="sh"><strong style="font-size:18px">New post</strong><button id="close" type="button" aria-label="Close">✕</button></div>
    <div class="row" style="margin-top:0">
      <input id="pcity" list="cities" placeholder="Your city or taluka" autocomplete="off" maxlength="60">
      <button id="pgps" type="button">📍 Use my location</button>
    </div>
    <div class="sub" id="pMsg" style="margin:6px 0 8px"></div>
    <textarea id="text" maxlength="1000" placeholder="What’s happening around you?"></textarea>
    <div id="prev" class="imgs n2" style="display:none"></div>
    <div class="row">
      <button id="pick" type="button">📷 Photos</button>
      <button id="post" class="pri" type="button">Post</button>
    </div>
    <div class="sub" style="margin-top:6px">Up to 4 photos (tap a photo to remove it).</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="err" id="err"></div>
    <div class="sub" style="margin-top:8px">📍 Your current location and Google name are saved with the post so people nearby can find it. Location is optional.</div>
  </div>
</div>

<div class="ov" id="pov"><div class="sheet"><div class="sh"><strong style="font-size:18px">Profile</strong><button id="pclose" type="button" aria-label="Close">✕</button></div><div id="pbody"></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,query,where,orderBy,limit,onSnapshot,arrayUnion,arrayRemove,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1) PASTE YOUR FIREBASE WEB APP CONFIG HERE (Firebase console > Project settings > Your apps)
const firebaseConfig={apiKey:"AIzaSyDqcgBb8TUQo6dH3EWu8HpiEqLMIVJ8C5s",authDomain:"city-c1137.firebaseapp.com",projectId:"city-c1137",storageBucket:"city-c1137.firebasestorage.app",messagingSenderId:"523789343679",appId:"1:523789343679:web:684c84b1fd523ddae0df0a"};

const $=i=>document.getElementById(i);
const CITIES="Mumbai|19.076|72.878;Pune|18.520|73.857;Pimpri-Chinchwad|18.627|73.801;Thane|19.218|72.978;Navi Mumbai|19.033|73.030;Badlapur|19.156|73.266;Kalyan|19.243|73.130;Nashik|19.998|73.790;Nagpur|21.146|79.088;Aurangabad|19.876|75.343;Kolhapur|16.705|74.243;Solapur|17.659|75.906;Delhi|28.614|77.209;Bengaluru|12.972|77.595;Hyderabad|17.385|78.487;Chennai|13.083|80.271;Kolkata|22.572|88.364;Ahmedabad|23.023|72.572;Surat|21.170|72.831;Jaipur|26.912|75.787;Lucknow|26.847|80.947;Bhopal|23.259|77.413;Indore|22.720|75.858;Chandigarh|30.733|76.779;Goa|15.299|74.124;Kochi|9.931|76.267;Patna|25.594|85.138;London|51.507|-0.128;New York|40.713|-74.006;San Francisco|37.775|-122.419;Dubai|25.205|55.271;Singapore|1.352|103.820;Sydney|-33.869|151.209;Toronto|43.653|-79.383".split(";").map(s=>{const a=s.split("|");return{n:a[0],la:+a[1],lo:+a[2]}});
let user=null,posts=[],imgs=[],editing=null,unsub=null,city="",nearby=false,nearLoc=null,db=null,auth=null,folOnly=false,myFol=new Set(),cmUnsubs={},openCm=new Set(),profUnsubs=[];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
const note=t=>{const f=$("feed");f.textContent="";const n=document.createElement("div");n.className="note";n.textContent=t;f.appendChild(n)};
CITIES.forEach(c=>{const o=document.createElement("option");o.value=c.n;$("cities").appendChild(o)});
const normCity=s=>{s=(s||"").trim().replace(/\s+/g," ");const l=s.toLowerCase(),m=CITIES.find(c=>c.n.toLowerCase()===l);return m?m.n:s.replace(/\b\w/g,x=>x.toUpperCase())};
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2),h=x*x+Math.cos(a*r)*Math.cos(c*r)*y*y;return 12742*Math.asin(Math.sqrt(h))};
const getPos=(opts)=>new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,opts):rej());

// free reverse geocoding (OpenStreetMap Nominatim): taluka (county) + district
async function geocode(la,lo){
  const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=en&lat="+la+"&lon="+lo);
  const a=(await r.json()).address||{};
  const t=(a.county||a.city||a.town||a.village||a.suburb||"").replace(/\s+(taluka|tehsil|tahsil|mandal|sub-?district)$/i,"");
  const d=(a.state_district||"").replace(/\s+district$/i,"");
  return t?(d&&d!==t?t+", "+d:t):"";
}
async function gps(msg,cb){
  msg.textContent="Finding your location…";
  try{
    const p=await getPos({timeout:10000});const la=p.coords.latitude,lo=p.coords.longitude;
    let best=null,bd=1e9;CITIES.forEach(c=>{const d=dist(la,lo,c.la,c.lo);if(d<bd){bd=d;best=c}});
    if(best&&bd<10){msg.textContent="Using "+best.n+" from your location.";cb(best.n);return}
    const pl=await geocode(la,lo);
    if(!pl)throw 0;
    msg.textContent="Using "+pl+" from your location. You can edit the name.";cb(pl);
  }catch(e){msg.textContent="Couldn’t detect your place. Type your taluka or city name."}
}

function setNearbyUI(){$("near").classList.toggle("on",nearby);$("cityb").classList.toggle("on",!nearby);$("cityName").textContent=nearby?"your 500 m area":(city||"all cities")}
function setCity(c){nearby=false;city=normCity(c);ls("cwh_city",city);$("city").value=city;setNearbyUI();subscribe()}
$("city").onchange=function(){setCity(this.value)};
$("gps").onclick=()=>gps($("cityMsg"),setCity);
$("cityb").onclick=()=>{if(nearby){nearby=false;$("cityMsg").textContent="";setNearbyUI();subscribe()}else window.scrollTo({top:0,behavior:"smooth"})};
$("near").onclick=async()=>{
  if(nearby){nearby=false;setNearbyUI();subscribe();return}
  const m=$("cityMsg");m.textContent="Finding your location…";
  try{const p=await getPos({timeout:10000,enableHighAccuracy:true});nearLoc={la:p.coords.latitude,lo:p.coords.longitude};nearby=true;m.textContent="Showing posts within 500 m of you.";setNearbyUI();subscribe()}
  catch(e){m.textContent="Couldn’t get your location. Allow location access to see nearby posts."}
};
city=normCity(ls("cwh_city"));$("city").value=city;setNearbyUI();

// post sheet
const openSheet=()=>{$("ov").classList.add("on");$("pcity").value=city;$("pMsg").textContent="";$("err").textContent=""};
const closeSheet=()=>$("ov").classList.remove("on");
$("fab").onclick=openSheet;$("close").onclick=closeSheet;
$("ov").onclick=e=>{if(e.target===$("ov"))closeSheet()};
$("pgps").onclick=()=>gps($("pMsg"),n=>{$("pcity").value=n});
$("pick").onclick=()=>$("file").click();
const drawPrev=()=>{const pv=$("prev");pv.textContent="";pv.style.display=imgs.length?"grid":"none";pv.className="imgs n"+Math.max(1,imgs.length);imgs.forEach((d,i)=>{const im=document.createElement("img");im.src=d;im.alt="Selected photo";im.title="Tap to remove";im.onclick=()=>{imgs.splice(i,1);drawPrev()};pv.append(im)})};
function compress(f,cb,er){const r=new FileReader();r.onerror=er;r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL("image/jpeg",q);while(d.length>160000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}d.length>200000?er():cb(d)};im.onerror=er;im.src=r.result};r.readAsDataURL(f)}
$("file").onchange=function(){$("err").textContent="";[...this.files].slice(0,4-imgs.length).forEach(f=>compress(f,d=>{if(imgs.length<4){imgs.push(d);drawPrev()}},()=>{$("err").textContent="Couldn’t use one of the photos."}));this.value=""};

async function signIn(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("err").textContent="Sign-in failed. Allow pop-ups and try again."}}
$("sign").onclick=()=>user?signOut(auth):signIn();
function setAuth(){$("sign").textContent=user?"Sign out":"Sign in";$("post").textContent=user?"Post":"Sign in to post"}

$("post").onclick=async function(){
  $("err").textContent="";
  if(!user){signIn();return}
  const text=$("text").value.trim(),pc=normCity($("pcity").value);
  if(!pc){$("err").textContent="Choose your city or taluka first.";return}
  if(!text&&!imgs.length){$("err").textContent="Write something or add a photo first.";return}
  this.disabled=true;
  const d={text,img:"",imgs,city:pc,uid:user.uid,name:user.displayName||"Someone",ts:Date.now(),likes:[]};
  try{const p=await getPos({timeout:8000});d.lat=+p.coords.latitude.toFixed(5);d.lng=+p.coords.longitude.toFixed(5)}catch(e){}
  try{
    await addDoc(collection(db,"posts"),d);
    $("text").value="";imgs=[];drawPrev();closeSheet();if(pc!==city)setCity(pc);
  }catch(e){$("err").textContent="Couldn’t post: "+((e&&e.code)||"error")}
  this.disabled=false;
};

const ago=t=>{const s=Math.max(1,Math.floor((Date.now()-t)/1000));if(s<60)return"just now";const m=Math.floor(s/60);if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";const d=Math.floor(h/24);return d<7?d+"d ago":new Date(t).toLocaleDateString()};
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};

function editorCard(p){
  const c=mk("div","card"),ta=mk("textarea");ta.maxLength=1000;ta.value=editing.text;ta.oninput=()=>editing.text=ta.value;
  const err=mk("div","err"),row=mk("div","row"),sv=mk("button","pri","Save"),cn=mk("button","","Cancel");
  sv.onclick=async()=>{const t=editing.text.trim();if(!t&&!(p.imgs&&p.imgs.length)&&!p.img){err.textContent="A post needs some content.";return}sv.disabled=true;
    try{await updateDoc(doc(db,"posts",p.id),{text:t,edited:Date.now()});editing=null;render()}catch(e){err.textContent="Couldn’t save.";sv.disabled=false}};
  cn.onclick=()=>{editing=null;render()};
  row.append(sv,cn);c.append(ta,row,err);return c;
}
function media(p,c){
  const list=(p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[])).filter(x=>String(x).startsWith("data:image/jpeg")).slice(0,4);
  if(list.length){const g=mk("div","imgs n"+list.length);list.forEach(s=>{const i=mk("img","ph");i.src=s;i.alt="Photo";i.loading="lazy";g.append(i)});c.append(g)}
}
function openComments(p,c,btn,k){
  const box=mk("div","cm"),list=mk("div"),row=mk("div","row"),inp=mk("input"),send=mk("button","pri","Send");
  inp.placeholder="Write a comment…";inp.maxLength=300;row.append(inp,send);box.append(list,row);c.append(box);
  send.onclick=async()=>{if(!user){signIn();return}const t=inp.value.trim();if(!t)return;inp.value="";
    try{await addDoc(collection(db,"posts",p.id,"comments"),{uid:user.uid,name:user.displayName||"Someone",text:t,ts:Date.now()})}catch(e){inp.value=t}};
  cmUnsubs[k]=onSnapshot(query(collection(db,"posts",p.id,"comments"),orderBy("ts","asc"),limit(100)),snap=>{
    list.textContent="";btn.textContent="💬 "+snap.size;
    snap.docs.forEach(d=>{const x=d.data(),r=mk("p"),b=mk("b","",(x.name||"Someone")+" ");b.onclick=()=>openProfile(x.uid,x.name);r.append(b,document.createTextNode(x.text));
      if(user&&x.uid===user.uid){const dl=mk("span","link"," ✕");dl.onclick=()=>deleteDoc(d.ref).catch(()=>{});r.append(dl)}
      list.append(r)});
  });
}
function card(p,ns){
  const c=mk("div","card"),m=mk("div","meta"),nm=p.name||"Someone",k=ns+":"+p.id;
  const who=mk("strong","link",nm);who.style.color="var(--ink)";who.onclick=()=>openProfile(p.uid,nm);
  const av=mk("div","av",nm.charAt(0).toUpperCase());av.style.cursor="pointer";av.onclick=who.onclick;
  m.append(av,who);
  m.append(mk("span","",(p.city?p.city+" · ":"")+ago(p.ts)+(p.edited?" · edited":"")+(nearby&&p._d!=null?" · "+Math.round(p._d)+" m away":"")));
  c.append(m);
  if(p.text)c.append(mk("div","txt",p.text));
  media(p,c);
  const a=mk("div","acts"),likes=p.likes||[],liked=user&&likes.includes(user.uid),lb=mk("button",liked?"liked":"",(liked?"♥ ":"♡ ")+likes.length);
  lb.onclick=()=>{if(!user){openSheet();return}updateDoc(doc(db,"posts",p.id),{likes:liked?arrayRemove(user.uid):arrayUnion(user.uid)}).catch(()=>{})};
  const cb=mk("button","","💬 Comments");
  cb.onclick=()=>{if(cmUnsubs[k]){cmUnsubs[k]();delete cmUnsubs[k];openCm.delete(k);const o=c.querySelector(".cm");if(o)o.remove();cb.textContent="💬 Comments"}else{openCm.add(k);openComments(p,c,cb,k)}};
  a.append(lb,cb);
  if(user&&p.uid===user.uid){
    if(ns==="f"){const ed=mk("button","","Edit");ed.onclick=()=>{editing={id:p.id,text:p.text||""};render()};a.append(ed)}
    const del=mk("button","","Delete");del.onclick=()=>{if(confirm("Delete this post?"))deleteDoc(doc(db,"posts",p.id)).catch(()=>{})};a.append(del);
  }
  c.append(a);
  if(openCm.has(k))openComments(p,c,cb,k);
  return c;
}
const stopCm=ns=>Object.keys(cmUnsubs).filter(k=>k[0]===ns).forEach(k=>{cmUnsubs[k]();delete cmUnsubs[k]});
function render(){
  stopCm("f");
  const f=$("feed");f.textContent="";
  const list=folOnly?posts.filter(p=>myFol.has(p.uid)):posts;
  if(!list.length){note(folOnly?"No posts from people you follow here yet.":nearby?"No posts within 500 m of you yet. Tap + to post!":"No posts yet"+(city?" in "+city:"")+". Tap + to share what’s happening!");return}
  list.forEach(p=>f.append(editing&&editing.id===p.id?editorCard(p):card(p,"f")));
}

// profile: posts, followers, following, follow button
function openProfile(uid,name){
  if(!uid||!db)return;
  $("pov").classList.add("on");const b=$("pbody");b.textContent="Loading…";
  profUnsubs.forEach(f=>f());
  const st={posts:[],fers:[],fing:[]};
  const draw=()=>{
    stopCm("p");b.textContent="";
    const nm=(st.posts[0]&&st.posts[0].name)||name||"Someone";
    const h=mk("div","pf"),t=mk("div");h.append(mk("div","av",nm.charAt(0).toUpperCase()));
    t.append(mk("strong","",nm),mk("div","sub",st.posts.length+" posts · "+st.fers.length+" followers · "+st.fing.length+" following"));h.append(t);b.append(h);
    if(user&&user.uid!==uid){const f=st.fers.some(d=>d.data().a===user.uid),fb=mk("button",f?"":"pri",f?"Following ✓ (tap to unfollow)":"Follow");fb.style.marginBottom="10px";
      fb.onclick=()=>{const r=doc(db,"follows",user.uid+"_"+uid);(f?deleteDoc(r):setDoc(r,{a:user.uid,b:uid,ts:Date.now()})).catch(()=>{})};b.append(fb)}
    else if(!user){const fb=mk("button","pri","Sign in to follow");fb.style.marginBottom="10px";fb.onclick=signIn;b.append(fb)}
    if(!st.posts.length)b.append(mk("div","note","No posts yet."));
    st.posts.forEach(p=>b.append(card(p,"p")));
  };
  const fc=collection(db,"follows");
  profUnsubs=[
    onSnapshot(query(collection(db,"posts"),where("uid","==",uid),limit(50)),s=>{st.posts=s.docs.map(d=>({...d.data(),id:d.id})).sort((x,y)=>y.ts-x.ts);draw()}),
    onSnapshot(query(fc,where("b","==",uid)),s=>{st.fers=s.docs;draw()}),
    onSnapshot(query(fc,where("a","==",uid)),s=>{st.fing=s.docs;draw()})];
}
const closeProfile=()=>{$("pov").classList.remove("on");profUnsubs.forEach(f=>f());profUnsubs=[];stopCm("p")};
$("pclose").onclick=closeProfile;$("pov").onclick=e=>{if(e.target===$("pov"))closeProfile()};
$("me").onclick=()=>user?openProfile(user.uid,user.displayName):signIn();
$("fol").onclick=()=>{if(!user){signIn();return}folOnly=!folOnly;$("fol").classList.toggle("pri",folOnly);render()};

function subscribe(){
  if(unsub){unsub();unsub=null}
  posts=[];if(!db)return;
  note("Loading the feed…");
  const col=collection(db,"posts");let q;
  if(nearby&&nearLoc){const dd=.006;q=query(col,where("lat",">=",nearLoc.la-dd),where("lat","<=",nearLoc.la+dd),limit(300))}
  else q=city?query(col,where("city","==",city),limit(100)):query(col,orderBy("ts","desc"),limit(60));
  unsub=onSnapshot(q,snap=>{
    posts=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.ts-a.ts);
    if(nearby&&nearLoc)posts=posts.filter(p=>{if(typeof p.lat!=="number"||typeof p.lng!=="number")return false;p._d=dist(nearLoc.la,nearLoc.lo,p.lat,p.lng)*1000;return p._d<=500});
    if(!editing)render();
  },()=>note("Couldn’t load the feed. Check your Firebase config and rules."));
}

if(firebaseConfig.apiKey.startsWith("PASTE")){note("Setup needed: paste your Firebase config into index.html (see the setup steps).")}
else{
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  let fu=null;onAuthStateChanged(auth,u=>{user=u;setAuth();if(fu){fu();fu=null}myFol=new Set();if(u)fu=onSnapshot(query(collection(db,"follows"),where("a","==",u.uid)),sn=>{myFol=new Set(sn.docs.map(d=>d.data().b));if(!editing)render()});if(!editing)render()});
  subscribe();
  if(!city)gps($("cityMsg"),setCity);
}
setInterval(()=>{if(posts.length&&!editing)render()},60000);
</script>
</body>
</html>
